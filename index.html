<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05010f"><title>ÉTER</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--c:#55efff;--v:#a879ff;--g:#ffd66b;--bg:#05010f;--m:#9b91b5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#302064,var(--bg) 70%);color:#f8f5ff;font-family:system-ui,sans-serif}.app{max-width:820px;margin:auto;padding:14px}.hidden{display:none!important}.brand{text-align:center;padding:24px 0}.logo{font-size:clamp(70px,20vw,118px);font-weight:1000;letter-spacing:-.1em;background:linear-gradient(135deg,#fff,var(--c),var(--v),#ff5ec4);-webkit-background-clip:text;color:transparent}.tag{font-size:11px;letter-spacing:.15em;color:#c9c0df}.card,.box{background:#10091fee;border:1px solid #35275a;border-radius:24px;padding:17px;margin-bottom:12px;box-shadow:0 20px 70px #0008}.stack{display:grid;gap:10px}.btn{width:100%;border:0;border-radius:15px;padding:15px;font-weight:900;background:linear-gradient(135deg,#bdfaff,var(--c));color:#05020c}.btn.secondary{background:#160e2a;border:1px solid #49366e;color:#fff}.muted{color:var(--m);font-size:12px}.profile{display:flex;gap:14px;align-items:center}.ava,.smallava{display:grid;place-items:center;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,var(--c),var(--v));flex:none}.ava{width:76px;height:76px;font-size:34px}.smallava{width:50px;height:50px;font-size:22px}.ava img,.smallava img{width:100%;height:100%;object-fit:cover}.name{font-size:23px;font-weight:1000}.rank{color:var(--g);font-size:12px;font-weight:900}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{text-align:center;padding:12px;border:1px solid #2b1e49;border-radius:16px;background:#090514}.stat b{display:block;font-size:20px}.stat small{color:var(--m);font-size:10px}.players{display:grid;gap:8px}.player{display:flex;align-items:center;gap:11px;padding:11px;border:1px solid #2a1d45;border-radius:18px;background:#090514;cursor:pointer}.player-info{min-width:0;flex:1}.player-info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.player-info small{color:var(--m)}.dot{width:8px;height:8px;border-radius:50%;background:#5dffb0;box-shadow:0 0 12px #5dffb0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.modal{position:fixed;inset:0;background:#020106ed;z-index:20;display:grid;place-items:center;padding:12px}.box{width:min(620px,100%);max-height:94svh;overflow:auto}.challenge{text-align:center;padding:20px;border-radius:20px;background:#17102d;border:1px solid #4a3770}.challenge strong{display:block;font-size:23px;margin-bottom:7px}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:40;background:#17102a;border:1px solid #4b3970;border-radius:14px;padding:11px 14px;font-size:12px}.error{color:#ff9bc8;font-size:12px}.ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:15px}.cell{aspect-ratio:1;border:1px solid #49366e;border-radius:18px;background:#090514;color:#fff;font-size:clamp(42px,13vw,72px);font-weight:1000}.cell.x{color:#55efff}.cell.o{color:#ff71d1}.rps{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:16px}.rps .btn{font-size:30px;padding:20px 8px}.rps small{display:block;font-size:11px;margin-top:7px}.nav{display:grid;grid-template-columns:1fr 1fr;padding:7px;border:1px solid #2c2048;border-radius:18px;background:#090512}.nav button{border:0;background:transparent;color:#aaa0c1;padding:11px}.nav .on{color:#fff;background:#19102f;border-radius:12px}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:560px){.grid{grid-template-columns:1fr}.rps{grid-template-columns:1fr}}
</style></head><body><div id="login" class="app"><div class="brand"><div class="logo">ÉTER</div><div class="tag">ENTRÁ · JUGÁ · EVOLUCIONÁ</div></div><div class="card stack"><div class="muted">Entrá con Google. Tu email nunca se muestra a otros jugadores.</div><button class="btn" onclick="loginGoogle()">G · ENTRAR CON GOOGLE</button><div id="loginError" class="error"></div></div></div><div id="setup" class="app hidden"><div class="brand"><div class="logo" style="font-size:72px">ÉTER</div></div><div class="card stack"><b>Elegí tu alias</b><input id="gameName" maxlength="24" placeholder="Ej.: Neo" style="padding:14px;border-radius:14px;border:1px solid #49366e;background:#090514;color:#fff"><button class="btn" onclick="saveName()">ENTRAR A ÉTER</button><div id="setupError" class="error"></div></div></div><main id="app" class="app hidden"><div class="brand"><div class="logo">ÉTER</div><div class="tag">ENTORNO · COMPETENCIA · ÉTER</div></div><section id="home"><div class="card"><div class="profile"><div id="homeAva" class="ava">⚡</div><div><div id="homeName" class="name"></div><div id="homeRank" class="rank"></div></div></div><div class="stats" style="margin-top:12px"><div class="stat"><b id="homeEther">0</b><small>ÉTER</small></div><div class="stat"><b id="homeLevel">1</b><small>NIVEL</small></div><div class="stat"><b id="homeWins">0</b><small>VICTORIAS</small></div></div></div><div class="card stack"><b>📡 JUGADORES CONECTADOS</b><div class="muted">Tocá un jugador para ver su ficha y elegir cuánto Éter apostar.</div><div id="players" class="players"></div><div id="noPlayers" class="muted">Buscando jugadores...</div></div><div class="nav"><button class="on">⌂ Inicio</button><button onclick="goProfile()">👤 Perfil</button></div></section><section id="profile" class="hidden"><div class="card stack"><b>👤 PERFIL</b><div id="profileBox"></div><button class="btn secondary" onclick="signOut()">CERRAR SESIÓN</button></div><div class="nav"><button onclick="goHome()">⌂ Inicio</button><button class="on">👤 Perfil</button></div></section></main><div id="modal" class="modal hidden"><div class="box"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><b id="mt">ÉTER</b><button class="btn secondary" style="width:auto;padding:8px 12px" onclick="requestClose()">✕</button></div><div id="arena" class="stack"></div></div></div><div id="toast" class="toast hidden"></div><script>const U='https://thkurmkqzwfysoszkthe.supabase.co',K='sb_publishable_fqB1tI1EvIVYs2ZMyhD9PA_wUqeFLBN',P='https://kioscoa220munro.github.io/svgeter/';const sb=window.supabase.createClient(U,K);let session=null,profile=null,selected=null,activeMatch=null,realtimeChannel=null,lastStateVersion=-1;const games=[['target','🎯','Tocar el objetivo',5],['reflex','⚡','Reflejos',5],['rps','✊','Piedra, papel o tijera',5],['ttt','❌','Ta-Te-Ti',5],['memory','🧠','Memoria rápida',10],['quiz','❓','Quiz Éter',10],['connect4','🔴','Conecta 4',25],['checkers','♟️','Damas',50],['naval','🚢','Batalla naval',25],['truco','🃏','Truco',50],['chaos','💠','Éter Caos',10]];const $=x=>document.querySelector(x);function toast(t){const e=$('#toast');e.textContent=t;e.classList.remove('hidden');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.add('hidden'),3000)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function loginGoogle(){const{error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:P,queryParams:{prompt:'select_account'}}});if(error)$('#loginError').textContent=error.message}function show(id){$('#login').classList.toggle('hidden',id!=='login');$('#setup').classList.toggle('hidden',id!=='setup');$('#app').classList.toggle('hidden',id!=='app')}async function saveName(){const n=$('#gameName').value.trim();if(n.length<2)return $('#setupError').textContent='Usá al menos 2 caracteres.';const{error}=await sb.rpc('eter_set_game_name',{new_name:n});if(error)return $('#setupError').textContent=error.message;await load()}async function load(){if(!session)return;const{data,error}=await sb.from('eter_players').select('*').eq('id',session.user.id).maybeSingle();if(error)return $('#loginError').textContent=error.message;if(!data?.game_name){show('setup');return}profile=data;show('app');render();await touch();await players();subscribeMatches();startPolling()}function render(){const a=profile.is_admin;$('#homeName').textContent=a?'ADMIN ÉTER':profile.game_name;$('#homeRank').textContent=a?'👑 NIVEL 100':'ÉTER · NIVEL '+(profile.level||1);$('#homeEther').textContent=a?'∞':profile.ether??0;$('#homeLevel').textContent=a?100:profile.level||1;$('#homeWins').textContent=a?'∞':profile.wins??0;const av=profile.avatar_url?'<img src="'+esc(profile.avatar_url)+'">':'⚡';$('#homeAva').innerHTML=av;$('#profileBox').innerHTML='<div class="profile"><div class="ava">'+av+'</div><div><div class="name">'+esc(a?'ADMIN ÉTER':profile.game_name)+'</div><div class="rank">'+(a?'ÉTER ABSOLUTO · NIVEL 100':'ÉTER · NIVEL '+(profile.level||1))+'</div></div></div>'}async function touch(){await sb.rpc('eter_touch_presence')}async function players(){const{data,error}=await sb.rpc('eter_get_online_players');if(error){console.error(error);return}const list=data||[];$('#noPlayers').classList.toggle('hidden',!!list.length);$('#players').innerHTML=list.map(p=>'<div class="player" data-id="'+p.id+'"><div class="smallava">'+(p.avatar_url?'<img src="'+esc(p.avatar_url)+'">':'⚡')+'</div><div class="player-info"><b>'+esc(p.is_admin?'ADMIN ÉTER':p.game_name)+'</b><small>⚡ Nivel '+(p.is_admin?100:p.level||1)+' · 💠 '+(p.is_admin?'∞':p.ether)+'</small></div><i class="dot"></i></div>').join('');document.querySelectorAll('.player').forEach(el=>el.onclick=()=>{const p=list.find(x=>x.id===el.dataset.id);if(p)openPlayer(p)})}function openPlayer(p){selected=p;const max=profile.is_admin?Infinity:Number(profile.ether||0);const stakes=[5,10,25,50].filter(s=>max>=s);$('#mt').textContent='⚔️ '+(p.is_admin?'ADMIN ÉTER':p.game_name);const av=p.avatar_url?'<img src="'+esc(p.avatar_url)+'">':'⚡';$('#arena').innerHTML='<div class="challenge"><div class="profile" style="justify-content:center;margin-bottom:14px"><div class="ava">'+av+'</div></div><strong>'+esc(p.is_admin?'ADMIN ÉTER':p.game_name)+'</strong><span class="muted">Nivel '+(p.is_admin?100:p.level||1)+' · 💠 '+(p.is_admin?'∞':p.ether)+' · 🏆 '+(p.is_admin?'∞':p.wins||0)+'</span></div><div class="muted" style="text-align:center">Elegí cuánto Éter apostar</div><div class="grid">'+stakes.map(s=>'<button class="btn secondary wager" data-stake="'+s+'">💠 '+s+' ÉTER<br><small>🎰 RULETA DE JUEGOS</small></button>').join('')+'</div>'+(stakes.length?'':'<div class="challenge">No tenés suficiente Éter para apostar.</div>');document.querySelectorAll('.wager').forEach(b=>b.onclick=()=>sendStake(Number(b.dataset.stake)));$('#modal').classList.remove('hidden')}function closeModal(){$('#modal').classList.add('hidden');selected=null}function requestClose(){if(activeMatch){if(confirm('¿Salir de la partida? Tu rival gana la apuesta.'))leaveMatch();}else closeModal()}async function leaveMatch(){if(!activeMatch)return closeModal();const id=activeMatch.match_id;const{data,error}=await sb.rpc('eter_leave_match',{p_match_id:id});if(error){toast(error.message);return}activeMatch=null;lastStateVersion=-1;closeModal();await players();toast('Partida finalizada. Volviste a la sala.')}async function sendStake(stake){if(!selected)return;const{error}=await sb.rpc('eter_send_challenge',{p_receiver:selected.id,p_game:'roulette',p_stake:stake});if(error)return toast(error.message);closeModal();toast('🎰 Apuesta de '+stake+' Éter enviada. Esperando que acepte...')}async function checkChallenges(){const{data}=await sb.rpc('eter_get_my_pending_challenges');const c=data?.[0];if(c&&window.lastChallenge!==c.id){window.lastChallenge=c.id;showChallenge(c)}}function showChallenge(c){$('#mt').textContent='⚔️ PROPUESTA';$('#arena').innerHTML='<div class="challenge"><strong>🎰 TE DESAFIARON</strong><span class="muted">'+esc(c.challenger_name)+' quiere jugar.<br><br>Apuesta: <b>'+c.stake+' Éter</b><br>La ruleta elegirá el juego para los dos.</span></div><button class="btn" id="accept">ACEPTAR Y GIRAR RULETA</button><button class="btn secondary" id="reject">RECHAZAR</button>';$('#modal').classList.remove('hidden');$('#accept').onclick=()=>respond(c.id,true);$('#reject').onclick=()=>respond(c.id,false)}async function respond(id,yes){const{data,error}=await sb.rpc('eter_respond_challenge',{p_challenge:id,p_accept:yes});if(error)return toast(error.message);closeModal();if(!yes)return toast('Propuesta rechazada.');if(data?.status!=='accepted')return toast('La propuesta venció.');activeMatch=null;lastStateVersion=-1;startMatch(data.match_id,data.game_key,Number(data.stake))}async function checkMatch(){const{data}=await sb.rpc('eter_get_my_active_match');if(!data?.length){if(activeMatch){activeMatch=null;lastStateVersion=-1;closeModal();await players()}return}const m=data[0];if(!activeMatch||activeMatch.match_id!==m.match_id){activeMatch=m;lastStateVersion=-1;startMatch(m.match_id,m.game_key,Number(m.stake))}else await syncMatchState(m.match_id)}async function syncMatchState(id){if(!activeMatch||activeMatch.match_id!==id)return;const{data,error}=await sb.rpc('eter_get_game_state',{p_match_id:id});if(error||!data?.length)return;const m=data[0];const v=Number(m.state_version??0);if(v<lastStateVersion)return;lastStateVersion=v;if(m.game_key==='ttt')drawTTTState(m,Number(m.stake));if(m.game_key==='rps')drawRPSState(m,Number(m.stake))}function subscribeMatches(){if(!session)return;if(realtimeChannel)sb.removeChannel(realtimeChannel);realtimeChannel=sb.channel('eter-match-live-'+session.user.id).on('postgres_changes',{event:'UPDATE',schema:'public',table:'eter_matches'},payload=>{const m=payload.new;if(!session||!m||(m.player_a!==session.user.id&&m.player_b!==session.user.id))return;if(activeMatch?.match_id!==m.id)return;if(m.status==='finished'){syncFinishedMatch(m);return}syncMatchState(m.id)}).subscribe()}async function syncFinishedMatch(m){if(!activeMatch)return;const stake=Number(m.stake||activeMatch.stake||5);if(m.game_key==='ttt'){const my=session.user.id;$('#mt').textContent='❌ TA-TE-TI';$('#arena').innerHTML='<div class="challenge"><strong>'+((m.winner_id===my)?'🏆 GANASTE':(m.winner_id?'💀 PERDISTE':'🤝 EMPATE'))+'</strong><span class="muted">La partida terminó.</span><button class="btn secondary" style="margin-top:14px" onclick="finishMatchView()">VOLVER A LA SALA</button></div>'}else if(m.game_key==='rps'){const my=session.user.id;$('#mt').textContent='✊ PIEDRA, PAPEL O TIJERA';$('#arena').innerHTML='<div class="challenge"><strong>'+((m.winner_id===my)?'🏆 GANASTE':(m.winner_id?'💀 PERDISTE':'🤝 EMPATE'))+'</strong><span class="muted">Apuesta: <b>'+stake+' Éter</b></span><button class="btn secondary" style="margin-top:14px" onclick="finishMatchView()">VOLVER A LA SALA</button></div>'}else toast('Partida terminada. Volviendo a la sala...')}function finishMatchView(){activeMatch=null;lastStateVersion=-1;closeModal();load()}function startPolling(){clearInterval(window.poll);window.poll=setInterval(async()=>{await touch();await players();await checkChallenges();await checkMatch()},1000);checkChallenges();checkMatch()}function startMatch(id,key,stake){const g=games.find(x=>x[0]===key)||games[0];$('#mt').textContent=g[1]+' '+g[2];$('#arena').innerHTML='<div class="challenge"><strong>🎰 RULETA ÉTER</strong><span class="muted">Apuesta: <b>'+stake+' Éter</b></span><div style="font-size:55px;margin:15px;animation:spin .7s linear infinite">🎰</div><b>JUEGO SELECCIONADO</b><div style="font-size:28px;margin-top:8px">'+g[1]+' '+g[2]+'</div><span class="muted">Entrando a la partida...</span></div>';$('#modal').classList.remove('hidden');setTimeout(()=>{if(activeMatch?.match_id===id)launchGame(id,key,stake)},900)}async function launchGame(id,key,stake){if(key==='ttt')return renderTTT(id,stake);if(key==='rps')return renderRPS(id,stake);$('#mt').textContent='🎮 '+(games.find(x=>x[0]===key)?.[2]||key);$('#arena').innerHTML='<div class="challenge"><strong>🎮 '+esc(games.find(x=>x[0]===key)?.[2]||key)+'</strong><span class="muted">Partida contra tu rival · apuesta '+stake+' Éter</span><div style="margin-top:15px" class="muted">Este motor está pendiente de integración.</div><button class="btn secondary" style="margin-top:14px" onclick="requestClose()">SALIR DE LA PARTIDA</button></div>'}async function renderTTT(id,stake){const{data,error}=await sb.rpc('eter_get_game_state',{p_match_id:id});if(error||!data?.length)return toast('No se pudo cargar Ta-Te-Ti.');lastStateVersion=Number(data[0].state_version??0);drawTTTState(data[0],stake)}function drawTTTState(m,stake){const s=m.game_state||{};const board=s.board||[null,null,null,null,null,null,null,null,null];const my=session.user.id;const myMark=my===m.player_a?'X':'O';const turnName=m.turn_player_id===my?'TU TURNO':'TURNO DEL RIVAL';$('#mt').textContent='❌ TA-TE-TI';$('#arena').innerHTML='<div class="challenge"><strong>❌ TA-TE-TI</strong><span class="muted">Apuesta: <b>'+stake+' Éter</b><br>'+turnName+' · Vos sos <b>'+myMark+'</b></span><div class="ttt">'+board.map((v,i)=>'<button class="cell '+(v==='X'?'x':v==='O'?'o':'')+'" data-cell="'+(i+1)+'">'+(v||'')+'</button>').join('')+'</div><div id="tttStatus" class="muted" style="margin-top:12px"></div><button class="btn secondary" style="margin-top:12px" onclick="requestClose()">SALIR DE LA PARTIDA</button></div>';document.querySelectorAll('.cell').forEach(b=>b.onclick=()=>tttMove(m.match_id,Number(b.dataset.cell)));if(m.status==='finished')$('#tttStatus').textContent=m.winner_id?(m.winner_id===my?'🏆 GANASTE':'💀 PERDISTE'):'🤝 EMPATE';document.querySelectorAll('.cell').forEach(b=>b.disabled=m.status==='finished'||m.turn_player_id!==my)}async function tttMove(id,cell){const{data,error}=await sb.rpc('eter_ttt_move',{p_match_id:id,p_cell:cell});if(error)return toast(error.message);await syncMatchState(id);if(data?.winner_id)toast(data.winner_id===session.user.id?'🏆 ¡Ganaste el Ta-Te-Ti!':'💀 Perdiste el Ta-Te-Ti.');else if(data?.draw)toast('🤝 Empate.')}async function renderRPS(id,stake){const{data,error}=await sb.rpc('eter_get_game_state',{p_match_id:id});if(error||!data?.length)return toast('No se pudo cargar Piedra, papel o tijera.');lastStateVersion=Number(data[0].state_version??0);drawRPSState(data[0],stake)}function drawRPSState(m,stake){const my=session.user.id,s=m.game_state||{},choices=s.choices||{},mine=choices[my]||null,finished=m.status==='finished';$('#mt').textContent='✊ PIEDRA, PAPEL O TIJERA';if(finished)return syncFinishedMatch(m);$('#arena').innerHTML='<div class="challenge"><strong>✊ PIEDRA, PAPEL O TIJERA</strong><span class="muted">Apuesta: <b>'+stake+' Éter</b></span><div class="rps">'+[['piedra','🪨','PIEDRA'],['papel','📄','PAPEL'],['tijera','✂️','TIJERA']].map(x=>'<button class="btn secondary" data-rps="'+x[0]+'">'+x[1]+'<small>'+x[2]+'</small></button>').join('')+'</div><div id="rpsStatus" class="muted" style="margin-top:14px">'+(mine?'Tu elección: <b>'+mine+'</b><br>Esperando al rival…':'Elegí una opción.')+'</div><button class="btn secondary" style="margin-top:12px" onclick="requestClose()">SALIR DE LA PARTIDA</button></div>';document.querySelectorAll('[data-rps]').forEach(b=>{b.onclick=()=>rpsMove(m.match_id,b.dataset.rps);b.disabled=!!mine})}async function rpsMove(id,choice){const{data,error}=await sb.rpc('eter_game_action',{p_match_id:id,p_action:{type:'choice',choice:choice}});if(error)return toast(error.message);if(data?.winner_id){await syncMatchState(id)}else{toast('✊ Elección enviada. Esperando al rival…');await syncMatchState(id)}}function goProfile(){$('#home').classList.add('hidden');$('#profile').classList.remove('hidden')}function goHome(){$('#profile').classList.add('hidden');$('#home').classList.remove('hidden');players()}async function signOut(){if(activeMatch){await leaveMatch()}clearInterval(window.poll);if(realtimeChannel)sb.removeChannel(realtimeChannel);await sb.from('eter_presence').delete().eq('player_id',session.user.id);await sb.auth.signOut();show('login')}sb.auth.onAuthStateChange(async(_,s)=>{session=s;if(s)await load();else show('login')});(async()=>{const{data}=await sb.auth.getSession();session=data.session;if(session)await load();else show('login')})();</script></body></html>
