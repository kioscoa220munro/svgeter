name: Patch ÉTER
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="""async function joinUniversalRoom(){if(!session)return;clearInterval(window.presenceBeat);if(window.presenceVisibility)document.removeEventListener('visibilitychange',window.presenceVisibility);if(window.presencePagehide)window.removeEventListener('pagehide',window.presencePagehide);const stamp=()=>new Date().toISOString();const beat=async()=>{if(!session||document.visibilityState==='hidden')return;const now=stamp();const {error}=await sb.from('eter_presence').upsert({player_id:session.user.id,last_seen:now,updated_at:now},{onConflict:'player_id'});if(error){console.error('ÉTER presence heartbeat:',error.message);return}await refreshPlayers()};window.presenceVisibility=async()=>{if(document.visibilityState==='visible'){await beat();await refreshPlayers()}else if(session){await sb.from('eter_presence').delete().eq('player_id',session.user.id)}};window.presencePagehide=()=>{if(!session)return;fetch(SUPABASE_URL+'/rest/v1/eter_presence?player_id=eq.'+session.user.id,{method:'DELETE',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+session.access_token,Prefer:'return=minimal'},keepalive:true}).catch(()=>{})};document.addEventListener('visibilitychange',window.presenceVisibility);window.addEventListener('pagehide',window.presencePagehide);await beat();window.presenceBeat=setInterval(beat,8000)}"""
          new="""async function joinUniversalRoom(){if(!session)return;clearInterval(window.presenceBeat);if(window.presenceVisibility)document.removeEventListener('visibilitychange',window.presenceVisibility);if(window.presencePagehide)window.removeEventListener('pagehide',window.presencePagehide);const beat=async()=>{if(!session||document.visibilityState==='hidden')return;const {error}=await sb.rpc('eter_touch_presence');if(error){console.error('ÉTER presence heartbeat:',error.message);return}await refreshPlayers()};window.presenceVisibility=async()=>{if(document.visibilityState==='visible'){await beat()}else if(session){await sb.from('eter_presence').delete().eq('player_id',session.user.id)}};window.presencePagehide=()=>{if(!session)return;fetch(SUPABASE_URL+'/rest/v1/eter_presence?player_id=eq.'+session.user.id,{method:'DELETE',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+session.access_token,Prefer:'return=minimal'},keepalive:true}).catch(()=>{})};document.addEventListener('visibilitychange',window.presenceVisibility);window.addEventListener('pagehide',window.presencePagehide);await beat();window.presenceBeat=setInterval(beat,8000)}"""
          if old not in s: raise SystemExit('joinUniversalRoom target not found')
          s=s.replace(old,new,1)
          old="""async function refreshPlayers(){if(!session)return;const cutoff=new Date(Date.now()-60000).toISOString();const {data,error}=await sb.from('eter_presence').select('player_id,last_seen').gt('last_seen',cutoff);if(error){console.error('ÉTER presence read:',error.message);return}const ids=[...new Set((data||[]).map(x=>x.player_id))].filter(id=>id!==session.user.id);if(!ids.length){$('#players').innerHTML='';$('#noPlayers').classList.remove('hidden');setEnv(profile?.level||1,false);return}const {data:ps,error:pe}=await sb.from('eter_players').select('id,game_name,avatar_url,ether,level,wins,frame,is_admin').in('id',ids);if(pe){console.error('ÉTER players read:',pe.message);return}const players=(ps||[]).filter(p=>p.game_name&&p.game_name.trim());renderPlayers(players);const hasAdmin=players.some(p=>p.is_admin);const levels=[profile?.level||1,...players.filter(p=>!p.is_admin).map(p=>p.level||1)];const avg=Math.round(levels.reduce((a,b)=>a+b,0)/levels.length);setEnv(hasAdmin?100:Math.min(99,Math.max(1,avg)),hasAdmin)}"""
          new="""async function refreshPlayers(){if(!session)return;const {data,error}=await sb.rpc('eter_get_online_players');if(error){console.error('ÉTER online players:',error.message);return}const players=(data||[]).filter(p=>p.game_name&&p.game_name.trim());if(!players.length){$('#players').innerHTML='';$('#noPlayers').classList.remove('hidden');setEnv(profile?.level||1,false);return}renderPlayers(players);const hasAdmin=players.some(p=>p.is_admin);const levels=[profile?.level||1,...players.filter(p=>!p.is_admin).map(p=>p.level||1)];const avg=Math.round(levels.reduce((a,b)=>a+b,0)/levels.length);setEnv(hasAdmin?100:Math.min(99,Math.max(1,avg)),hasAdmin)}"""
          if old not in s: raise SystemExit('refreshPlayers target not found')
          s=s.replace(old,new,1)
          old="""function openPlayer(p){selectedPlayer=p;const available=affordableGames();$('#mt').textContent=p.is_admin?'👑 ADMIN ÉTER':p.game_name;let gameHtml=available.length?available.map((g,i)=>{const realIndex=games.indexOf(g);return '<button class=\"btn secondary\" onclick=\"sendChallenge('+realIndex+')\">'+g[1]+' '+g[2]+'<br><small>💠 Apuesta '+g[4]+' Éter · '+g[3]+'</small></button>'}).join(''):'<div class=\"challenge\"><strong>💠 ÉTER INSUFICIENTE</strong><span class=\"muted\">No tenés suficiente Éter para cubrir ninguna apuesta disponible.</span></div>';$('#arena').innerHTML='<div class=\"challenge\">'+frameHtml(p)+'<div style=\"font-size:14px;font-weight:900;margin-top:10px\">'+escapeHtml(p.is_admin?'ADMIN ÉTER':p.game_name)+'</div><div class=\"muted\">⚡ NIVEL '+(p.is_admin?100:(p.level||1))+' · 💠 '+(p.is_admin?'∞':(p.ether??0))+' · 🏆 '+(p.is_admin?'∞':(p.wins??0))+' VICTORIAS</div></div><div class=\"label\">COMPETENCIAS QUE PODÉS APOSTAR</div><div class=\"grid\">'+gameHtml+'</div>';$('#modal').classList.remove('hidden')}"""
          new="""function openPlayer(p){selectedPlayer=p;const stakes=[5,10,25,50].filter(v=>profile?.is_admin||Number(profile?.ether??0)>=v);$('#mt').textContent=p.is_admin?'👑 ADMIN ÉTER':p.game_name;const html=stakes.length?stakes.map(v=>'<button class=\"btn secondary\" onclick=\"sendChallengeStake('+v+')\">💠 APUESTA '+v+' ÉTER<br><small>🎰 La ruleta elegirá entre todos los juegos posibles</small></button>').join(''):'<div class=\"challenge\"><strong>💠 ÉTER INSUFICIENTE</strong><span class=\"muted\">No tenés suficiente Éter para ninguna apuesta.</span></div>';$('#arena').innerHTML='<div class=\"challenge\">'+frameHtml(p)+'<div style=\"font-size:14px;font-weight:900;margin-top:10px\">'+escapeHtml(p.is_admin?'ADMIN ÉTER':p.game_name)+'</div><div class=\"muted\">⚡ NIVEL '+(p.is_admin?100:(p.level||1))+' · 💠 '+(p.is_admin?'∞':(p.ether??0))+' · 🏆 '+(p.is_admin?'∞':(p.wins??0))+' VICTORIAS</div></div><div class=\"label\">ELEGÍ LA APUESTA</div><div class=\"grid\">'+html+'</div>';$('#modal').classList.remove('hidden')}"""
          if old not in s: raise SystemExit('openPlayer target not found')
          s=s.replace(old,new,1)
          old="""async function sendChallenge(i){if(!selectedPlayer)return;const g=games[i];if(!profile.is_admin&&Number(profile.ether??0)<g[4]){toast('💠 No tenés Éter suficiente para esa apuesta.');return}const {data,error}=await sb.rpc('eter_send_challenge',{p_receiver:selectedPlayer.id,p_game:g[0]});if(error){toast(error.message);return}closeModal();toast('⚔️ Propuesta enviada · '+g[2]+' · '+data.stake+' Éter')}"""
          new="""async function sendChallengeStake(stake){if(!selectedPlayer)return;if(!profile.is_admin&&Number(profile.ether??0)<stake){toast('💠 No tenés Éter suficiente.');return}const {data,error}=await sb.rpc('eter_send_challenge',{p_receiver:selectedPlayer.id,p_game:'roulette',p_stake:stake});if(error){toast(error.message);return}closeModal();toast('🎰 Apuesta enviada · '+stake+' Éter · esperando aceptación')}"""
          if old not in s: raise SystemExit('sendChallenge target not found')
          s=s.replace(old,new,1)
          old="""function showChallenge(c){const g=games.find(x=>x[0]===c.game_key)||['','','Competencia','',''];$('#mt').textContent='⚔️ PROPUESTA';$('#arena').innerHTML='<div class=\"challenge\"><strong>⚔️ '+escapeHtml(g[2])+'</strong><span class=\"muted\">Te propusieron competir por <b>'+c.stake+' Éter</b>.</span></div><div class=\"stack\"><button class=\"btn\" onclick=\"answerChallenge(\\\''+c.id+'\\\',true)\">ACEPTAR Y JUGAR</button><button class=\"btn secondary\" onclick=\"answerChallenge(\\\''+c.id+'\\\',false)\">RECHAZAR</button></div>';$('#modal').classList.remove('hidden')}"""
          new="""function showChallenge(c){$('#mt').textContent='⚔️ PROPUESTA';$('#arena').innerHTML='<div class=\"challenge\"><strong>🎰 RULETA ÉTER</strong><span class=\"muted\">El rival te propone competir.<br>Apuesta: <b>'+c.stake+' Éter</b><br>Al aceptar, la ruleta elegirá un juego posible para ese monto.</span></div><div class=\"stack\"><button class=\"btn\" onclick=\"answerChallenge(\\\''+c.id+'\\\',true)\">ACEPTAR Y GIRAR RULETA</button><button class=\"btn secondary\" onclick=\"answerChallenge(\\\''+c.id+'\\\',false)\">RECHAZAR</button></div>';$('#modal').classList.remove('hidden')}"""
          if old not in s: raise SystemExit('showChallenge target not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "ÉTER: ruleta por apuesta y presencia server-side"
          git push