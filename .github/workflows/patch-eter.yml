name: Patch ÉTER
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          replacements=[
          ("const stamp=()=>new Date().toISOString();const beat=async()=>{if(!session||document.visibilityState==='hidden')return;const now=stamp();const {error}=await sb.from('eter_presence').upsert({player_id:session.user.id,last_seen:now,updated_at:now},{onConflict:'player_id'});if(error){console.error('ÉTER presence heartbeat:',error.message);return}await refreshPlayers()};","const beat=async()=>{if(!session||document.visibilityState==='hidden')return;const {error}=await sb.rpc('eter_touch_presence');if(error){console.error('ÉTER presence heartbeat:',error.message);return}await refreshPlayers()};"),
          ("async function refreshPlayers(){if(!session)return;const cutoff=new Date(Date.now()-60000).toISOString();const {data,error}=await sb.from('eter_presence').select('player_id,last_seen').gt('last_seen',cutoff);if(error){console.error('ÉTER presence read:',error.message);return}const ids=[...new Set((data||[]).map(x=>x.player_id))].filter(id=>id!==session.user.id);if(!ids.length){$('#players').innerHTML='';$('#noPlayers').classList.remove('hidden');setEnv(profile?.level||1,false);return}const {data:ps,error:pe}=await sb.from('eter_players').select('id,game_name,avatar_url,ether,level,wins,frame,is_admin').in('id',ids);if(pe){console.error('ÉTER players read:',pe.message);return}const players=(ps||[]).filter(p=>p.game_name&&p.game_name.trim());renderPlayers(players);","async function refreshPlayers(){if(!session)return;const {data,error}=await sb.rpc('eter_get_online_players');if(error){console.error('ÉTER online players:',error.message);return}const players=(data||[]).filter(p=>p.game_name&&p.game_name.trim());if(!players.length){$('#players').innerHTML='';$('#noPlayers').classList.remove('hidden');setEnv(profile?.level||1,false);return}renderPlayers(players);"),
          ("function openPlayer(p){selectedPlayer=p;const available=affordableGames();","function openPlayer(p){selectedPlayer=p;const available=affordableGames();"),
          ("function sendChallenge(i){","function sendChallenge(i){")]
          for old,new in replacements:
              if old in s: s=s.replace(old,new,1)
          # Replace the player challenge UI and sender in a tolerant way.
          a=s.index('function openPlayer(p){'); b=s.index('function closeModal()',a)
          new="""function openPlayer(p){selectedPlayer=p;const stakes=[5,10,25,50].filter(v=>profile?.is_admin||Number(profile?.ether??0)>=v);$('#mt').textContent=p.is_admin?'👑 ADMIN ÉTER':p.game_name;const html=stakes.length?stakes.map(v=>'<button class=\\\"btn secondary\\\" onclick=\\\"sendChallengeStake('+v+')\\\">💠 APUESTA '+v+' ÉTER<br><small>🎰 La ruleta elegirá entre los juegos posibles</small></button>').join(''):'<div class=\\\"challenge\\\"><strong>💠 ÉTER INSUFICIENTE</strong></div>';$('#arena').innerHTML='<div class=\\\"challenge\\\">'+frameHtml(p)+'<div style=\\\"font-size:14px;font-weight:900;margin-top:10px\\\">'+escapeHtml(p.is_admin?'ADMIN ÉTER':p.game_name)+'</div><div class=\\\"muted\\\">⚡ NIVEL '+(p.is_admin?100:(p.level||1))+' · 💠 '+(p.is_admin?'∞':(p.ether??0))+'</div></div><div class=\\\"label\\\">ELEGÍ LA APUESTA</div><div class=\\\"grid\\\">'+html+'</div>';$('#modal').classList.remove('hidden')}"""
          s=s[:a]+new+s[b:]
          a=s.index('async function sendChallenge(i){'); b=s.index('function listenRealtime()',a)
          new="""async function sendChallengeStake(stake){if(!selectedPlayer)return;const {data,error}=await sb.rpc('eter_send_challenge',{p_receiver:selectedPlayer.id,p_game:'roulette',p_stake:stake});if(error){toast(error.message);return}closeModal();toast('🎰 Apuesta enviada · '+stake+' Éter · esperando aceptación')}"""
          s=s[:a]+new+s[b:]
          a=s.index('function showChallenge(c){'); b=s.index('sb.auth.onAuthStateChange',a)
          new="""function showChallenge(c){$('#mt').textContent='⚔️ PROPUESTA';$('#arena').innerHTML='<div class=\\\"challenge\\\"><strong>🎰 RULETA ÉTER</strong><span class=\\\"muted\\\">Apuesta: <b>'+c.stake+' Éter</b><br>Al aceptar, la ruleta elige el juego.</span></div><div class=\\\"stack\\\"><button class=\\\"btn\\\" onclick=\\\"answerChallenge(\\\''+c.id+'\\\',true)\\\">ACEPTAR Y GIRAR RULETA</button><button class=\\\"btn secondary\\\" onclick=\\\"answerChallenge(\\\''+c.id+'\\\',false)\\\">RECHAZAR</button></div>';$('#modal').classList.remove('hidden')}"""
          s=s[:a]+new+s[b:]
          # Make acceptance visibly route to roulette without pretending a game engine exists.
          a=s.index('async function answerChallenge(id,accept){'); b=s.index('sb.auth.onAuthStateChange',a)
          new="""async function answerChallenge(id,accept){const {data,error}=await sb.rpc('eter_respond_challenge',{p_challenge:id,p_accept:accept});if(error){toast(error.message);return}closeModal();if(data?.status==='accepted'){toast('🔥 Aceptada · la ruleta está entrando en juego.')}else toast(accept?'La propuesta venció.':'Propuesta rechazada.')}"""
          s=s[:a]+new+s[b:]
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "ÉTER: jugadores y ruleta funcionando"
          git push
