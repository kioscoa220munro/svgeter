name: Smoke research

on:
  workflow_dispatch:
  push:
    paths:
      - 'research_*.py'
      - 'null_models.py'
      - '.github/workflows/smoke-research.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python prepare_constants.py --n 1000 --output-dir data
      - run: python research_runner.py --data-dir data --n 100 1000 --l-max 8 --all-lengths --null-reps 20 --seed 220 --output smoke_results.csv
      - run: test -s smoke_results.csv
      - run: test -s smoke_results_null.csv
